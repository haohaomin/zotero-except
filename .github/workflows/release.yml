name: Release plugin

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Verify tag matches manifest
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./manifest.json').version")"
      - name: Generate update manifest
        shell: bash
        run: |
          file="dist/zotero-except-$(node -p "require('./manifest.json').version").xpi"
          hash="$(sha256sum "$file" | cut -d ' ' -f1)"
          version="$(node -p "require('./manifest.json').version")"
          python3 - "$version" "$hash" > dist/updates.json <<'PY'
          import json, sys
          version, digest = sys.argv[1:]
          print(json.dumps({"addons": {"zotero-except@local": {"updates": [{
              "version": version,
              "update_link": f"https://github.com/haohaomin/zotero-except/releases/download/v{version}/zotero-except-{version}.xpi",
              "update_hash": f"sha256:{digest}",
              "applications": {"zotero": {"strict_min_version": "7.0", "strict_max_version": "10.0.*"}}
          }]}}}, indent=2))
          PY
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.xpi
            dist/updates.json
